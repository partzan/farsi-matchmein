# Linked project: MMI (sfbofhyqwmwvgjkndkdg)
# Only auth + edge-function JWT flags are managed here.
# Push carefully: `supabase config push --yes`

[auth]
enabled = true
site_url = "https://r359.ir/"
additional_redirect_urls = [
  "https://r359.ir/",
  "https://www.r359.ir/",
  "https://match-me-govm0v7kp-match-me-in.vercel.app/",
  "http://localhost:5173/",
  "http://127.0.0.1:5173/",
]
enable_signup = true
enable_anonymous_sign_ins = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 6
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.otp-send]
verify_jwt = false

[functions.otp-verify]
verify_jwt = false
